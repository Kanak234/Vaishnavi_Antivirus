name: CI

on:
  push:
    branches: [ "main", "master", "prod-hardening" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Lint with Ruff
        run: ruff check .

      - name: Type check with Mypy
        run: mypy Vaishnavi_Antivirus_Full_GUI/vaishnavi_av

      - name: Run test suite with coverage
        run: pytest -v --cov=vaishnavi_av --cov-report=term-missing --cov-fail-under=90

      - name: Validate distribution packaging
        run: pip wheel --no-deps -w dist .

  docker:
    name: Docker Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vaishnavi-antivirus .

      - name: Smoke test container
        run: docker run --rm vaishnavi-antivirus --version
