[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaishnavi-antivirus"
version = "1.0.0"
description = "Vaishnavi Antivirus - Cybersecurity Suite with signature detection, heuristics, quarantine, and system monitoring"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Kanak Prabhakar", email = "kanakprabhakar72@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
vaishnavi-av = "vaishnavi_av.main:run"

[tool.setuptools.package-dir]
"" = "Vaishnavi_Antivirus_Full_GUI"

[tool.setuptools.packages.find]
where = ["Vaishnavi_Antivirus_Full_GUI"]
include = ["vaishnavi_av*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["Vaishnavi_Antivirus_Full_GUI", "."]
addopts = "-v --cov=vaishnavi_av --cov-report=term-missing"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402",
    "E701",
    "E702",
    "E722",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
